<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem</title>
<link rel="stylesheet" href="css/style.css">

<style>
.btn-tv {
  background-color: rgb(120, 123, 198);
  color: aliceblue;
  border: none;
  padding: 8px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
  margin-left: 8px;
}

.btn-tv:hover {
  background-color: rgb(162, 160, 225);
}

.pacientes-fila {
  margin-bottom: 30px;
  background: cornsilk;
  border-radius: 8px;
  padding: 16px;
  border: 1px solid rgb(193, 209, 238);
}

.pacientes-fila h3 {
  margin-top: 0;
  color: black;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pacientes-fila h3 span {
  font-size: 13px;
  font-weight: normal;
  color: cornflowerblue;
}

.fila-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: rgb(180, 168, 212);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 8px;
  border: 1px solid rgb(232, 229, 246);
}

.fila-item strong {
  font-size: 15px;
}

.fila-item small {
  color: cornflowerblue;
  font-size: 12px;
}

.btn-abrir-tv {
  display: inline-block;
  background-color: azure;
  color: beige;
  padding: 8px 14px;
  border-radius: 5px;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.btn-abrir-tv:hover {
  background: rgb(124, 121, 162);
}
</style>
</head>

<body>

<div class="container">

<!-- cabeçalho com botão da TV -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">

<h2 style="margin: 0;">triagem Hospitalar</h2>

<button
  class="btn-abrir-tv"
  onclick="window.open('tv.html','_blank')"
>
  abrir tela da tv
</button>

</div>

<!-- fila de pacientes do Atendimento criada para mostrar quem pode ser chamdo na tv -->
<div class="pacientes-fila">

<h3>
  pacientes cadastrados no atendimento
  <span>clique em "chamar na TV" para chamar ao guichê</span>
</h3>

<div id="fila-pacientes">

<p style="color: rgb(76, 76, 128); text-align: center;">
  carregando...
</p>

</div>

<button
  onclick="carregarPaciente()"
  style="margin-top:8px; background: cornflowerblue; color: aliceblue; border:none; padding: 6px 12px; border-radius: 4px; cursor:pointer; font-size:13px"
>
  atualizar lista
</button>

</div>

<h2>🏥 Triagem Hospitalar</h2>

<input id="nome" placeholder="Nome">

<select id="sintoma">

<option value="">Selecione</option>
<option value="dor_leve">Dor leve</option>
<option value="resfriado">Resfriado</option>
<option value="coriza">Coriza</option>
<option value="tosse">Tosse</option>
<option value="febre">Febre</option>
<option value="vomito">Vômito</option>
<option value="diarreia">Diarreia</option>
<option value="falta_ar_moderada">Falta de ar moderada</option>
<option value="falta_ar_grave">Falta de ar grave</option>
<option value="infarto">Suspeita de infarto</option>
<option value="avc">Suspeita de AVC</option>
<option value="convulsao">Convulsão</option>
<option value="hemorragia">Hemorragia</option>

</select>

<input
  id="temp"
  type="number"
  placeholder="Temperatura"
/>

<input
  id="alergia"
  placeholder="Alergias"
/>

<textarea
  id="observacao"
  placeholder="Observações"
></textarea>

<div id="resultado"></div>

<button onclick="salvar()">
  Salvar Triagem
</button>

</div>

<script>

function classificarRisco(sintoma, temperatura) {

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (temperatura >= 39) {
    return "vermelho";
  }

  if (vermelhos.includes(sintoma)) {
    return "vermelho";
  }

  if (amarelos.includes(sintoma)) {
    return "amarelo";
  }

  return "verde";
}


function salvar() {

  const nome =
    document.getElementById("nome").value;

  const sintoma =
    document.getElementById("sintoma").value;

  const temperatura =
    Number(document.getElementById("temp").value);

  const alergia =
    document.getElementById("alergia").value;

  const observacao =
    document.getElementById("observacao").value;

  const risco =
    classificarRisco(sintoma, temperatura);

  fetch("http://localhost:3000/triagem", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      nome,
      sintoma,
      temperatura,
      alergia,
      observacao,
      risco

    })

  })

  .then(r => r.json())

  .then(data => {

    const resultado =
      document.getElementById("resultado");

    resultado.className = risco;

    resultado.innerHTML =
      "Classificação: " +
      risco.toUpperCase();

    alert("Triagem salva");

  });

}


function carregarPaciente() {

  fetch("/pacientes")

  .then(r => r.json())

  .then(pacientes => {

    const div =
      document.getElementById("fila-pacientes");

    // mostrar apenas os com status "triagem"
    const fila =
      pacientes.filter(p => p.status === "triagem");

    if (fila.length === 0) {

      div.innerHTML =
        "<p style='color:#888; text-align:center;'>nenhum paciente aguardando.</p>";

      return;
    }

    div.innerHTML = "";

    fila.forEach(p => {

      const item =
        document.createElement("div");

      item.className = "fila-item";

      item.innerHTML = `
        <div>
          <strong>${p.nome}</strong><br>
          <small>
            CPF: ${p.cpf || "-"} | Tipo: ${p.tipo || "-"}
          </small>
        </div>

        <button
          class="btn-tv"
          onclick="chamarNaTV('${p.nome}')"
        >
          chamar na TV
        </button>
      `;

      div.appendChild(item);

    });

  })

  .catch(() => {

    document.getElementById("fila-pacientes").innerHTML =
      "<p style='color:red;'>Erro ao carregar pacientes.</p>";

  });

}


// função criada para enviar o nome do paciente para a TV
// quando ele for chamado no guichê.
function chamarNaTV(nome) {

  fetch("/tv/chamar", {

    method: "POST",

    headers: {
      "content-type": "application/json"
    },

    body: JSON.stringify({

      localTipo: "GUICHE",
      localNumero: "01",
      paciente: nome

    })

  })

  .then(r => r.json())

  .then(() => {

    alert(
      nome +
      " foi chamado na TV para o guichê 01!"
    );

  });

}
//carrega a fila ao abrir a pagina
carregarPaciente();

//Atualizar a lista automaticamente a cada 10 segundos
setInterval(carregarPaciente, 10000);

</script>

</body>
</html>
